services:
  claude-code:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TZ: ${TZ:-America/Los_Angeles}
        CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-latest}
        GIT_DELTA_VERSION: 0.18.2
        ZSH_IN_DOCKER_VERSION: 1.2.0
    container_name: claude-code-sandbox
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GH_TOKEN=${GH_TOKEN:-}
      - NODE_OPTIONS=--max-old-space-size=4096
      - CLAUDE_CONFIG_DIR=/home/node/.claude
      - POWERLEVEL9K_DISABLE_GITSTATUS=true
      - TERM=xterm-256color
      - COLORTERM=truecolor
      - FORCE_COLOR=1
    volumes:
      # Mount your project directory here
      - ${PROJECT_DIR:-.}:/workspace
      # For git worktrees: mount the parent repo (defaults to PROJECT_DIR when not set)
      - ${GIT_PARENT_REPO:-${PROJECT_DIR:-.}}:/git-parent-repo
      # Import SSH keys, Claude auth, and git config from host without masking image content
      - ~/.ssh:/host-ssh:ro
      - ~/.claude:/host-claude:ro
      - ~/.gitconfig:/host-gitconfig:ro
      # Persistent volumes for history and Claude config
      - claude-code-bashhistory:/commandhistory
      - claude-code-config:/home/node/.claude
      # Mount Docker socket for Docker access
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      # Expose port for OAuth callback during web-based login
      - "38714:38714"
    working_dir: /workspace
    user: node
    stdin_open: true
    tty: true
    entrypoint: ["/usr/local/bin/start-claude.sh"]

volumes:
  claude-code-bashhistory:
  claude-code-config:

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
